name: Release

on:
  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      version:
        description: "Número da versão (ex: v.1.0.0)"
        required: true
        type: string
        
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Montar o pacote
        run: zip -r "trabalho-devops-$VERSION.zip" README.md CHANGELOG.md .github
      
      - name: Criar release
        env: 
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "trabalho-devops-$VERSION.zip" \
            -- title "$VERSION" \
            --noter-file CHANGELOG.md
